name: kogen
build:
  recipe: ladder
checks:
  - name: full
    argv: [make, check-full]
    timeout_ms: 900000
acceptance_checks:
  - name: compile
    argv: [env, MIX_ENV=test, mise, exec, --, mix, test, --warnings-as-errors, --exclude, test, "{path}"]
    timeout_ms: 300000
  - name: credo
    argv: [mise, exec, --, mix, credo, --strict, "{path}"]
    timeout_ms: 120000
fix:
  - name: format
    argv: [mix, format, --force]
    timeout_ms: 60000
diagnose:
  - glob: "lib/**/*.ex"
    argv: [mise, exec, --, mix, compile, --warnings-as-errors]
protected_paths:
  - mix.exs
  - test/support/**
  - test/test_helper.exs
gate_paths:
  - Makefile
  - .credo.exs
  - .formatter.exs
  - .dialyzer_ignore.exs
  - tools/**
domains:
  cli: [lib/kogen/cli.ex, lib/kogen/cli]
  contracts: [lib/kogen/contracts.ex, lib/kogen/contracts, test/contracts]
  intent: [lib/kogen/intent.ex, lib/kogen/intent, test/intent]
  project: [lib/kogen/project.ex, lib/kogen/project, test/project]
  proc: [lib/kogen/proc.ex, lib/kogen/proc, test/proc]
  workspace: [lib/kogen/workspace.ex, lib/kogen/workspace, test/workspace]
  state: [lib/kogen/state.ex, lib/kogen/state, test/state]
  checks: [lib/kogen/checks.ex, lib/kogen/checks, test/checks]
  harness: [lib/kogen/harness.ex, lib/kogen/harness, test/harness]
  tooling: [lib/kogen/tooling.ex, lib/kogen/tooling, test/tooling]
  build: [lib/kogen/build.ex, lib/kogen/build, test/build]
  engine: [lib/kogen/engine.ex, lib/kogen/engine, test/engine, test/acceptance, test/e2e]
  runner: [lib/kogen/runner.ex, lib/kogen/runner, test/runner]
  kernel: [lib/kogen/kernel.ex, lib/kogen/kernel, test/kernel]
  queue: [lib/kogen/queue.ex, lib/kogen/queue, test/queue]
  shaper: [lib/kogen/shaper.ex, lib/kogen/shaper, test/shaper]
  docs: [docs, README.md]
